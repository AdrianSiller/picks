<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">

<title>Picks del Día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column like a bet slip; sticky header with tabs; cards expand in place for detail */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#141a24; --muted:#5d6676; --line:#dfe3ea;
  --accent:#d9561a; --accent-soft:#fbe7dc; --team:#2a5ca8; --good:#1f8a4c; --good-soft:#dcf1e4; --warn:#b7791f; --warn-soft:#f8ecd3; --bad:#c03a3a;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1117; --surface:#161c26; --ink:#e8ebf0; --muted:#9aa3b2; --line:#283142;
  --accent:#f07a3e; --accent-soft:#3a2418; --team:#7fa9ea; --good:#4cc27e; --good-soft:#163222; --warn:#e0a849; --warn-soft:#352a14; --bad:#ef6b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1117; --surface:#161c26; --ink:#e8ebf0; --muted:#9aa3b2; --line:#283142;
  --accent:#f07a3e; --accent-soft:#3a2418; --team:#7fa9ea; --good:#4cc27e; --good-soft:#163222; --warn:#e0a849; --warn-soft:#352a14; --bad:#ef6b6b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:14px 0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{white-space:nowrap;font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.01em;margin:0;line-height:1;text-transform:uppercase}
h1 span{color:var(--accent)}
.date{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.src{font-size:12px;color:var(--muted);margin:6px 0 10px}
.tabs{display:flex;gap:4px}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;font:600 15px var(--f-body);color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible,.card:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main .wrap{padding-block:16px 40px;display:flex;flex-direction:column;gap:12px}
.lead{font-size:13px;color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:left;width:100%;color:inherit;font:inherit;display:block}
.row{display:flex;gap:12px;align-items:flex-start}
.rank{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;color:var(--muted);width:26px;flex:none;text-align:center;padding-top:2px}
.main{flex:1;min-width:0}
.who{font-weight:600;font-size:16px}
.meta{font-size:12.5px;color:var(--muted)}
.pick{font-family:var(--f-display);font-weight:600;font-size:21px;letter-spacing:.01em;margin-top:4px;text-transform:uppercase}
.price{flex:none;text-align:right}
.price b{display:block;font-family:var(--f-mono);font-weight:600;font-size:21px;font-variant-numeric:tabular-nums;color:var(--accent)}
.price small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.why{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);margin-top:8px;font-variant-numeric:tabular-nums}
.prob{margin-top:10px}
.bar{position:relative;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.probtxt{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;letter-spacing:.02em}
.c-good{background:var(--good-soft);color:var(--good)}
.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-acc{background:var(--accent-soft);color:var(--accent)}
.detail{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.detail h3{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--bg);border-radius:8px;padding:8px}
.stat b{display:block;font-family:var(--f-mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.chart{overflow-x:auto}
svg text{font-family:var(--f-mono)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.game .teams{display:flex;justify-content:space-between;align-items:center;gap:10px}
.team{font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:uppercase;line-height:1}
.team small{display:block;font:400 12px var(--f-body);color:var(--muted);text-transform:none;margin-top:4px}
.vs{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center;white-space:nowrap}
.lines{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.lines div{background:var(--bg);border-radius:8px;padding:8px;text-align:center}
.lines span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lines b{font-family:var(--f-mono);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums}
.inj{font-size:12.5px;margin-top:10px;color:var(--muted)}
.inj b{color:var(--ink);font-weight:600}
.mini{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.mini:first-of-type{border-top:0}
.mini .r{font-family:var(--f-mono);text-align:right;flex:none;font-variant-numeric:tabular-nums}
.slip .legs{margin:10px 0 0;padding:0;list-style:none}
.slip .legs li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.slip .legs li .lp{font-family:var(--f-mono);flex:none}
.slip .tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:10px;border-top:2px solid var(--ink)}
.slip .tot b{font-family:var(--f-mono);font-size:22px;font-weight:600;color:var(--accent)}
.slip .legs li .lp,.mini .r b{color:var(--accent);font-weight:600}
.slip h2{font-family:var(--f-display);font-weight:600;font-size:20px;text-transform:uppercase;margin:0}
.l5{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px}
.l5-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.l5 i{font-style:normal;font-family:var(--f-mono);font-size:13px;font-weight:500;min-width:26px;height:24px;line-height:24px;text-align:center;border-radius:6px;font-variant-numeric:tabular-nums}
.l5 i.y{background:var(--good-soft);color:var(--good)}
.l5 i.n{background:var(--bg);color:var(--muted)}
.l5-note{font-size:10.5px;color:var(--muted);margin-left:2px}
.l5 i.nj{background:transparent;border:1px dashed var(--line);color:var(--muted);font-size:11px}
.l5 i.low{box-shadow:inset 0 -2px 0 var(--warn)}
.l5 i sup{font-size:9px;margin-left:1px;color:var(--warn)}
.filters{display:flex;flex-direction:column;gap:8px}
.lgs{display:flex;gap:6px;flex-wrap:wrap}
.lgb{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font:600 13px var(--f-body);cursor:pointer}
.lgb[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.fsel{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 12px}
.fsel span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fsel select{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 14px var(--f-body);padding:8px 4px}
.fsel select:focus-visible,.lgb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tb{background:var(--bg);border-radius:8px;padding:8px;min-width:0}
.tb-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px}
.tb-h b{font-family:var(--f-display);font-size:16px;color:var(--team)}
.tb-h span{font-family:var(--f-mono);font-size:13px}
.tb .l5{margin-top:4px;gap:3px}
.tb .l5 i{min-width:0;flex:1;font-size:11.5px;padding:0 2px;height:22px;line-height:22px}
.tb .l5 i.n{background:var(--surface)}
.tb .l5-note{display:none}
.l5-legend{font-size:10.5px;color:var(--muted);margin-top:3px}
.team-line{font-size:13px;font-weight:600;color:var(--team)}
.hits{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.hits div{background:var(--bg);border-radius:8px;padding:6px 8px}
.hits b{display:block;font-family:var(--f-mono);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums}
.hits span{font-size:11px;color:var(--muted);line-height:1.2;display:block}
.probtxt b{color:var(--ink)}
.gloss{margin:0;display:grid;gap:8px}
.gloss dt{font-weight:600;font-size:13px}
.gloss dd{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.gpick{margin-top:14px;padding:12px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--accent)}
.gpick.pass{background:var(--bg);border-color:var(--line)}
.gpick-h{font:600 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.gpick.pass .gpick-h{color:var(--muted)}
.gpick-main{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:4px 0 2px}
.gpick-main span{font-family:var(--f-display);font-weight:600;font-size:21px;text-transform:uppercase}
.gpick-main b{font-family:var(--f-mono);font-weight:600;font-size:21px;color:var(--accent)}
.gpick-why{font-size:12.5px;margin-top:6px}
.results summary{display:flex;justify-content:space-between;gap:10px;font:600 13px var(--f-body);cursor:pointer;list-style:none}
.results summary::-webkit-details-marker{display:none}
.results summary b{font-family:var(--f-mono)}.pos{color:var(--good)}.neg{color:var(--bad)}
.mu td{text-align:center;font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.mu td small{display:block;color:var(--muted);font-size:10.5px}
.mu td.mu-g b{color:var(--good)}.mu td.mu-b b{color:var(--bad, #c0392b)}
.mu-notes{margin:8px 0 0;padding-left:18px;font-size:12.5px}.mu-notes li{margin:3px 0}
.others{margin-top:10px}.others h4{margin:0 0 2px;font:600 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
h3.sub{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px}
.tablewrap{overflow-x:auto}
table.opts,table.form{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.opts th,table.form th{font-weight:500;font-size:11px;color:var(--muted);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
table.opts td,table.form td{white-space:nowrap;text-align:right;padding:6px;border-bottom:1px solid var(--line);font-family:var(--f-mono)}
table.opts th:first-child,table.opts td:first-child{text-align:left;font-family:var(--f-body)}
table.opts tr.best td{color:var(--accent);font-weight:600}
table.form tbody th{text-align:left;font:700 16px var(--f-display);color:var(--ink);border-bottom:1px solid var(--line)}
table.form tbody th small{display:block;font:400 10.5px var(--f-body);color:var(--muted)}
.dots{white-space:nowrap}
.dots i{display:inline-block;width:18px;height:18px;line-height:18px;border-radius:4px;margin-left:2px;text-align:center;font:600 10px var(--f-body);font-style:normal}
.dots i.w{background:var(--good-soft);color:var(--good)}
.dots i.l{background:var(--bg);color:var(--muted)}
.method{font-size:12.5px;color:var(--muted);line-height:1.5}
.method summary{cursor:pointer;font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.detail{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(-4px)}to{opacity:1;transform:none}}}
.sports{display:inline-flex;gap:4px;background:var(--bg);border-radius:999px;padding:3px;margin-top:10px}
.sport{border:0;background:none;padding:6px 16px;border-radius:999px;font:700 14px var(--f-display);letter-spacing:.06em;color:var(--muted);cursor:pointer}
.sport[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.price{max-width:88px}
.price .nop{display:block;text-transform:none;letter-spacing:0;font-size:10.5px;line-height:1.25;margin-top:2px}
.gmore{margin-top:12px}
.gmore>summary{cursor:pointer;font:600 13px var(--f-body);color:var(--accent);list-style:none;padding:6px 0}
.gmore>summary::-webkit-details-marker{display:none}
.gmore>summary::after{content:" ▾"}.gmore[open]>summary::after{content:" ▴"}
.glist>summary{cursor:pointer;font:600 13px var(--f-body);list-style:none}.glist>summary::-webkit-details-marker{display:none}
.gl{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 0;cursor:pointer;color:var(--ink);font:inherit}
.gl-g{font:700 15px var(--f-display);letter-spacing:.02em}.gl-g small{display:block;font:400 11px var(--f-body);color:var(--muted)}
.gl-p{font:600 13.5px var(--f-body);color:var(--accent);text-align:right}.gl-none{color:var(--muted);font-weight:500}
.gl-p small{display:block;font:500 11.5px var(--f-body);margin-top:2px}.v-fair{color:var(--good)}.v-meh{color:var(--warn)}.v-bad{color:var(--bad)}
.gl-o{font-family:var(--f-mono);text-align:right;min-width:46px}.gl-o b{display:block;color:var(--accent)}.gl-o small{display:block;font-size:11px;color:var(--muted)}
.perf-top{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.perf-top small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.perf-top b{display:block;font:700 26px var(--f-display)}.perf-top span{font-size:13px}
table.perf td{font-size:13px}table.perf td:first-child{white-space:normal}
.pb{display:inline-block;width:54px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;overflow:hidden}
.pb i{display:block;height:100%}.pb i.g{background:var(--good)}.pb i.m{background:var(--warn)}.pb i.b{background:var(--bad)}
.why2{list-style:none;margin:6px 0 0;padding:0;font-size:12.5px;line-height:1.4}
.why2 li{position:relative;padding-left:16px;margin:2px 0;color:var(--ink)}
.why2 li::before{position:absolute;left:0;font-weight:700}
.why2 li.ry::before{content:"+";color:var(--good)}.why2 li.rx::before{content:"−";color:var(--bad)}.why2 li.rn::before{content:"•";color:var(--muted)}
.why2.full{margin-bottom:10px}
.refresh{display:flex;align-items:center;gap:10px;margin-top:8px}
.rbtn{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:6px 14px;font:600 13px var(--f-body);cursor:pointer}
.rbtn[disabled]{opacity:.6;cursor:wait}
.rstat{font-size:12px;color:var(--muted)}
.changes{border-left:3px solid var(--accent)}
.changes ul{margin:6px 0 0;padding-left:18px;font-size:13px}.changes li{margin:3px 0}
.ver{text-align:center;font-size:11px;color:var(--muted);padding:8px 0 24px}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>Picks <span id="sport-name">NBA</span></h1>
      <div class="date" id="date"></div>
    </div>
    <div class="sports" role="tablist" aria-label="Deporte">
      <button class="sport" role="tab" id="s-nba" aria-selected="true">NBA</button>
      <button class="sport" role="tab" id="s-nfl" aria-selected="false">NFL</button>
      <button class="sport" role="tab" id="s-soc" aria-selected="false">Soccer</button>
    </div>
    <div class="src" id="src"></div>
    <div class="refresh"><button class="rbtn" id="refresh" type="button">↻ Actualizar</button><span class="rstat" id="rstat"></span></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-picks" aria-selected="true">Top 10</button>
      <button class="tab" role="tab" id="t-games" aria-selected="false">Partidos</button>

      <button class="tab" role="tab" id="t-perf" aria-selected="false">Rendimiento</button>
    </div>
  </div>
</header>
<main><div class="wrap" id="view"><div class="loading">Cargando picks…</div></div></main>
<footer class="ver">Versión de la app: 4 nov 10:00 a.m.</footer>

<script>
// Self-update: the phone may keep an old copy of this page; if the published one is newer, reload it
const APP_VERSION = "20261104-1000";
fetch("./?check=" + Date.now(), {cache: "no-store"}).then(r => r.ok ? r.text() : "").then(t => {
  const m = t.match(/APP_VERSION = "([^"]+)"/);
  if (m && m[1] !== APP_VERSION && !location.search.includes("v=" + m[1])) location.replace("./?v=" + m[1]);
}).catch(() => {});
</script>
<script>(async () => {
const TZ = "America/Mexico_City";
const pct = x => Math.round(x * 100) + "%";
const fx = x => x == null || isNaN(x) ? "—" : (Math.round(x * 100) / 100).toFixed(2);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const phi = M.phi;
const fmtDiff = d => (d > 0 ? "+" : "") + d.toFixed(1);
const dateLbl = d => (d.length > 5 ? d.slice(5) : d).replace("-", "/");

/* ---------- data ---------- */
const getJSON = u => fetch(u + (u.includes("?") ? "&" : "?") + "t=" + Date.now(), {cache: "no-store"}).then(r => r.ok ? r.json() : null).catch(() => null);
const LATEST = await getJSON("data/latest.json");
window.M.CALIB = LATEST.calib || {};
if (LATEST.learn) window.M.PROP_W = {NBA: (LATEST.learn.NBA || {}).w ?? 0.5, NFL: (LATEST.learn.NFL || {}).w ?? 0.5};
const RESULTS = (await getJSON("data/results.json")) || {days: []};
// Today's picks as they were before each game started (so they stay visible after kickoff, with their result)
const SNAP_TODAY = (await getJSON(`data/snap/${new Date().toLocaleDateString("en-CA", {timeZone: "America/Mexico_City"})}.json`)) || {items: []};
function startedHtml(sp) {
  const now = new Date(), it = SNAP_TODAY.items.filter(x => x.sport === sp && new Date(x.d) <= now);
  if (!it.length) return "";
  const st = x => x.res ? (x.res.hit === 1 ? "✅" : x.res.hit === 0 ? "❌" : "➖") : now - new Date(x.d) < 3.5 * 36e5 ? "⏳" : "🕓";

const PTYPE = {NBA: {"Total Points": "PTS", "Total Assists": "AST", "Total Rebounds": "REB", "Total 3-Point Field Goals": "3PM"},
  NFL: {"Total Receptions": "REC", "Total Receiving Yards": "RECYDS", "Total Carries": "CAR", "Total Rushing Yards": "RUSHYDS", "Total Pass Completions": "CMP", "Total Passing Yards": "PASSYDS", "Total Rushing Plus Receiving Yards": "RRY"}};

async function refreshPlayers(sp, D) {
  const [sport, league] = ESPN[sp], SITE = `https://site.api.espn.com/apis/site/v2/sports/${sport}/${league}`, CORE = `https://sports.core.api.espn.com/v2/sports/${sport}/leagues/${league}`;
  const changes = [], outNames = {}; let ok = 0;
  await Promise.all(D.games.map(async g => {
    const base = `${CORE}/events/${g.id}/competitions/${g.id}/odds`;
    const [s, o, pb] = await Promise.all([getRaw(`${SITE}/summary?event=${g.id}`), getRaw(base + "?lang=en&region=us"), getRaw(base + "/100/propBets?lang=en&region=us&limit=1000")]);
    if (s || o) ok++;
    const tag = `${g.away.abbr} @ ${g.home.abbr}`;
    const state = s && s.header && s.header.competitions[0].status.type.state;
    if (state && state !== "pre") { g.started = true; changes.push(`${tag} ya empezó: se quitó de los picks.`); return; }
    if (s) {
      const before = new Map((g.inj || []).map(i => [i[1], i[2]])), now = [];
      for (const t of s.injuries || []) for (const x of t.injuries || []) now.push([t.team.abbreviation, x.athlete.displayName, x.status, x.athlete.id]);
      for (const i of now) { if (before.get(i[1]) !== i[2]) changes.push(`${i[1]} (${i[0]}): ${before.get(i[1]) ? before.get(i[1]) + " → " : ""}${i[2]}.`); if (OUTST[sp].has(i[2])) (outNames[i[0]] = outNames[i[0]] || []).push(i[1]); }
      g.inj = now.map(i => i.slice(0, 3)); g.injId = Object.fromEntries(now.map(i => [i[3], i[2]]));

      const starters = []; for (const t of (s.boxscore && s.boxscore.players) || []) for (const st of t.statistics || []) for (const a of st.athletes || []) if (a.starter) starters.push(a.athlete.id);

    }
    const L = dkLines(o); if (L && L.mlHome) { if (lineTxt(L) !== lineTxt(g.lines)) changes.push(`${tag}: línea ${lineTxt(g.lines) || "—"} → ${lineTxt(L)}.`); g.lines = L; }
    const props = {};
    if (pb) { const seen = {};
      for (const it of pb.items || []) { const nm = String((it.type && it.type.name) || "").replace(/\s*\(incl\. overtime\)/, ""), m = PTYPE[sp][nm], aid = (((it.athlete || {}).$ref || "").match(/athletes\/(\d+)/) || [])[1]; if (m && aid) (seen[aid + "|" + m] = seen[aid + "|" + m] || []).push(it); }
      for (const [k, arr] of Object.entries(seen)) { const t = arr[0].current && arr[0].current.target; props[k] = {l: t ? Number(t.value) : null, po: arr[0].odds ? +arr[0].odds.decimal.value : null, pu: arr[1] && arr[1].odds ? +arr[1].odds.decimal.value : null}; } }
    for (const c of D.cands.filter(c => c.g === g.id && !c.out)) {
      const st = g.injId && g.injId[c.aid];
      if (st && OUTST[sp].has(st)) { c.out = true; changes.push(`Sale ${c.n} (${st}): se quitó su pick.`); continue; }
      if (g.lineups && sp === "NBA" && !g.lineups.has(c.aid) && c.min >= 28 && c.s === "over") changes.push(`${c.n} no aparece como titular: revisa sus minutos.`);

}

async function refreshSoccer(D) {
  const changes = []; let ok = 0;
  await Promise.all(D.games.map(async g => {
    const slug = g.slug || {"Liga MX": "mex.1", "La Liga": "esp.1", "Premier": "eng.1", "Bundesliga": "ger.1", "Serie A": "ita.1", "Ligue 1": "fra.1", "Champions": "uefa.champions"}[g.lg], tag = `${g.away.abbr} @ ${g.home.abbr}`;
    const [s, o] = await Promise.all([getRaw(`https://site.api.espn.com/apis/site/v2/sports/soccer/${slug}/summary?event=${g.id}`), getRaw(`https://sports.core.api.espn.com/v2/sports/soccer/leagues/${slug}/events/${g.id}/competitions/${g.id}/odds?lang=en&region=us`)]);
    if (s || o) ok++;
    const state = s && s.header && s.header.competitions[0].status.type.state;
    if (state && state !== "pre") { g.started = true; return; }
    const ros = (s && s.rosters) || [];
    if (ros.length === 2 && ros.every(r => (r.roster || []).some(p => p.starter)) && !g.lineups) {
      g.lineups = true; g.xi = {}; const parts = [];
      for (const [k, T] of [["h", g.home], ["a", g.away]]) {
        const r = ros.find(x => x.homeAway === (k === "h" ? "home" : "away")) || ros.find(x => x.team && x.team.abbreviation === T.abbr), meta = (D.meta || {})[T.abbr];
        if (!r || !meta) continue; const ids = new Set((r.roster || []).filter(p => p.starter && p.athlete).map(p => String(p.athlete.id)));
        const miss = meta.reg.filter(([id]) => !ids.has(String(id))).map(x => x[1]); g.xi[k] = {miss};
        parts.push(miss.length ? `${T.abbr} sin ${miss.length} titular${miss.length > 1 ? "es" : ""} habitual${miss.length > 1 ? "es" : ""} (${miss.join(", ")})` : `${T.abbr} con su once habitual`);
      }
      changes.push(`${tag}: alineaciones confirmadas${parts.length ? ". " + parts.join("; ") + ". Ya entra en el modelo." : "."}`);
    }
    const L = dkLines(o); if (L && L.mlHome) { const was = `${fx((g.lines || {}).mlHome)}/${fx((g.lines || {}).draw)}/${fx((g.lines || {}).mlAway)}`, now = `${fx(L.mlHome)}/${fx(L.draw)}/${fx(L.mlAway)}`;

  socInit();
  return changes;
}
