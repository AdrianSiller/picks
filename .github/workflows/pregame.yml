name: Aviso antes del partido
on:
  schedule:
    # Cada 10 min revisa si un partido con picks empieza en 12-60 min; si sí, actualiza todo y avisa por Telegram
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  pregame:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Revisar y avisar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: node scripts/pregame.mjs
      - name: Guardar
        run: |
          git config user.name "picks-bot"
          git config user.email "picks-bot@users.noreply.github.com"
          git add data
          git commit -m "Datos antes del partido $(date -u '+%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin main
          git push
