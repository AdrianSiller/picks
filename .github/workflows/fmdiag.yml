name: Diagnóstico FotMob
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: |
          node scripts/diag/fm.mjs
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add data/fm; git commit -m "diag fotmob" || true; git pull --rebase; git push
