name: Actualizar picks
on:
  schedule:
    # GitHub suele retrasar los horarios varias horas, así que corre seguido (hora de Ciudad de México):
    # 5:23, 8:23, 11:23 am, 2:23 y 5:23 pm. SportsGameOdds solo en la primera corrida de cada día.
    - cron: "23 11,14,17,20,23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "model.js", ".github/workflows/update.yml"]
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bajar datos y calcular picks
        env:
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          # SportsGameOdds solo en la corrida de la mañana o a mano (el plan gratis tiene límite mensual)
          RUN_SGO: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sgo]')) && '1' || 'auto' }}
        run: |
          mkdir -p data
          node scripts/build.mjs 2>&1 | tee data/build.log
      - name: Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          { if [ ! -f data/telegram.json ]; then node scripts/alerts.mjs test; fi
            # Resumen por Telegram solo cuando se corre a mano (sin mensajes automáticos)
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then node scripts/alerts.mjs digest; fi
            echo "token presente: $([ -n "$TELEGRAM_TOKEN" ] && echo si || echo no)"; } 2>&1 | tee data/telegram.log
      - name: Guardar
        run: |
          git config user.name "picks-bot"
          git config user.email "picks-bot@users.noreply.github.com"
          git add data
          git commit -m "Datos $(date -u '+%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin main
          git push
