name: Diagnóstico xG
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probar fuentes de xG
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          K=$(printf "picks:%s" "$TELEGRAM_TOKEN" | sha256sum | cut -c1-32)
          W=https://picks-bot.adrian-rmzsiller.workers.dev/fx
          t() { echo "== $1"; curl -s -o /tmp/b -w "status %{http_code} bytes %{size_download}\n" -H "x-key: $K" --get --data-urlencode "u=$2" ${3:+--data-urlencode "x=1"} "$W"; head -c 300 /tmp/b | tr -d '\n'; echo; }
          {
          curl -s -H "x-key: $K" --get --data-urlencode "u=https://www.fotmob.com/api/data/leagues?id=47" "$W" > data/fm47.json; echo "fm47 $(wc -c < data/fm47.json)"
          echo "== directo sin worker"; curl -s -o /tmp/d -w "fotmob data directo %{http_code} %{size_download}\n" "https://www.fotmob.com/api/data/leagues?id=47"
          } > data/xgdiag.txt 2>&1
          cat data/xgdiag.txt
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add data/xgdiag.txt data/fm47.json; git commit -m "Diagnóstico xG" || true; git pull --rebase; git push
