name: Datos FotMob
on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  fm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/fmcache.mjs
      - run: |
          git config user.name "picks-bot"; git config user.email "picks-bot@users.noreply.github.com"
          git add data/fm; git commit -m "FotMob $(date -u '+%H:%M')" || exit 0
          git pull --rebase origin main; git push
