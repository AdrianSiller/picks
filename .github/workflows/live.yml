name: Marcadores
on: workflow_dispatch
permissions:
  contents: write
jobs:
  l:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: |
          node scripts/diag/live.mjs
          git config user.name picks-bot; git config user.email picks-bot@users.noreply.github.com
          git add data/fm/live.json; git commit -m "marcadores" || exit 0; git pull --rebase; git push
